<html lang="ko">

  <main id="app" class="app">
    <p class="loading">불러오는 중…</p>
  </main>

    document.getElementById("app").innerHTML =
      '<p class="loading">이 브라우저에서는 열 수 없어요.<br>휴대폰의 기본 브라우저(크롬, 사파리)로 열어 주세요.</p>';
  </script>
